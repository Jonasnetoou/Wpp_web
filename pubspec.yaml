name: wpp_web_wrapper
description: Wrapper WhatsApp Web em Flutter para uso pessoal
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  flutter_foreground_task: ^9.2.2
  permission_handler: ^11.3.0
  connectivity_plus: ^6.0.0
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
